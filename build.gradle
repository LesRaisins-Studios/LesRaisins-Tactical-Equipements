plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.74'
}

group = mod_group_id
version = mod_version
base {
    archivesName = "${mod_id}-${minecraft_version}"
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }
    validateAccessTransformers = true
    runs {
        client {
            client()
            gameDirectory = file('run/client_a')
        }
        client2 {
            client()
            gameDirectory = file('run/client_b')
            programArguments.addAll '--username', 'LrtTestPlayer'
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.mcmodderanchor'
            includeGroup 'com.github.FiguraMC.luaj'
        }
    }
    maven {
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    // Official TaCZ 1.2.0 NeoForge build. Override with -Ptacz_jar=/path/to/the/official.jar.
    implementation files(providers.gradleProperty('tacz_jar').getOrElse('libs/tacz-neoforge-1.21.1-1.2.0.jar'))
    implementation 'com.github.mcmodderanchor:simplebedrockmodel:2.6.2-neoforge-mc1.21.1'
    compileOnly 'com.maydaymemory:mae:1.1.4'
    implementation 'me.shedaniel.cloth:cloth-config-neoforge:15.0.140'
    implementation 'dev.kosmx.player-anim:player-animation-lib-forge:2.0.1+1.21.1'
    compileOnly 'com.github.FiguraMC.luaj:luaj-core:3.0.8-figura'
    compileOnly 'com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura'
    compileOnly 'org.apache.bcel:bcel:6.6.1'
    compileOnly 'org.apache.commons:commons-math3:3.6.1'
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.0.247'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247'
    runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.21.0.247'
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.named('processResources', ProcessResources) {
    def properties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_license: mod_license,
            mod_authors: mod_authors,
            minecraft_version_range: '[1.21.1]',
            neo_version_range: '[21.1.233,)'
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

configurations {
    gameTestCompileClasspath.extendsFrom compileClasspath
    gameTestRuntimeClasspath.extendsFrom runtimeClasspath
}

// The NeoForge dev launcher may exit with zero on a mod-loading failure.
// Require the actual test completion marker so CI does not report a false pass.
tasks.named('runGameTestServer') {
    doFirst {
        ext.startedAt = System.currentTimeMillis()
    }
    doLast {
        def result = file('run/gametest/logs/latest.log')
        if (!result.exists() || result.lastModified() < startedAt || !(result.getText('UTF-8') =~ /All [1-9][0-9]* required tests passed/)) {
            throw new GradleException('GameTests did not complete successfully. See run/gametest/logs/latest.log')
        }
    }
}
